type Administrator implements Node {
    id: ID!
    createdAt: DateTime!
    updatedAt: DateTime!
    firstName: String!
    lastName: String!
    emailAddress: String!
    avatar: AdministratorAvatar
    user: User!
}

type AdministratorAvatar {
    source: String!
    preview: String!
    mimeType: String!
    width: Int!
    height: Int!
}

type AdministratorList implements PaginatedList {
    items: [Administrator!]!
    totalItems: Int!
}
